name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 只读权限即可，工作流不需要写入仓库。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 固定 Node 24：src/services/newsEvents.ts 使用 node:sqlite，该模块在
      # Node 22.x 仍需 --experimental-sqlite，24.x 起无需 flag。
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build
